<svg width="324" height="345" viewBox="-20 -30 324 345" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  #bob-group {
    animation: bob 3.2s ease-in-out infinite;
    transform-origin: 142px 200px;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  #eye-right-pupil {
    transform-origin: 180px 165.5px;
    animation: blinkSquash 4.5s ease-in-out infinite;
  }
  #eye-left-pupil {
    transform-origin: 104px 165.5px;
    animation: blinkSquash 4.5s ease-in-out infinite;
  }
  @keyframes blinkSquash {
    0%, 88%, 100% { transform: scaleY(1); }
    92%           { transform: scaleY(0.05); }
    96%           { transform: scaleY(1); }
  }

  #eye-right-shine, #eye-left-shine {
    animation: blinkFade 4.5s ease-in-out infinite;
  }
  @keyframes blinkFade {
    0%, 89%, 97%, 100% { opacity: 1; }
    92%, 94%            { opacity: 0; }
  }

  #antenna {
    transform-origin: 141px 55px;
    animation: sway 3.2s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(4deg); }
  }

  #antenna-light {
    transform-origin: 160.5px 15px;
    animation: glow 1.6s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.18); opacity: 0.75; }
  }

  #ear-left {
    transform-origin: 44px 162px;
    animation: earPulse 3.2s ease-in-out infinite;
  }
  #ear-right {
    transform-origin: 240px 162px;
    animation: earPulse 3.2s ease-in-out infinite;
    animation-delay: 0.15s;
  }
  @keyframes earPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
</style>

